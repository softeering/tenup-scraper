name: Scrape TenUp

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: scrape-tenup
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Snapshot tournament IDs before scrape
        run: |
          if [ -f data/tournaments.json ]; then
            jq -r '.tournaments[].id' data/tournaments.json | sort -u > /tmp/old_ids
          else
            : > /tmp/old_ids
          fi

      - name: Run scraper
        run: python scraper.py

      - name: Count new tournaments
        id: diff
        run: |
          jq -r '.tournaments[].id' data/tournaments.json | sort -u > /tmp/new_ids
          NEW_COUNT=$(comm -13 /tmp/old_ids /tmp/new_ids | wc -l | tr -d ' ')
          echo "new_count=$NEW_COUNT" >> "$GITHUB_OUTPUT"
          echo "Found $NEW_COUNT new tournament(s)."

      - name: Open issue when new tournaments are found
        if: steps.diff.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_COUNT: ${{ steps.diff.outputs.new_count }}
        run: |
          gh issue create \
            --title "🎾 $NEW_COUNT nouveau(x) tournoi(s) détecté(s)" \
            --body "$NEW_COUNT nouveau(x) tournoi(s) depuis le dernier scrape.

          👉 https://softeering.github.io/tenup-scraper/"

      - name: Commit & push changes
        run: |
          if [ -z "$(git status --porcelain data/tournaments.json docs/index.md)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tournaments.json docs/index.md
          git commit -m "chore(data): refresh tournaments @ $(TZ=Europe/Paris date +%Y-%m-%dT%H:%M:%S%z)"
          git push origin HEAD:main
